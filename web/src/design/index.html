<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenSloper</title>
    <link rel="icon" href="opensloper-design.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#f2f1ed" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: auto 1fr auto;
        font:
          13px system-ui,
          sans-serif;
        color: #222428;
        background: #f2f1ed;
      }
      #toolbar {
        grid-column: 1 / 4;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-bottom: 1px solid #d8d6cf;
      }
      /* Shown at the toolbar's end while a new version waits */
      #update {
        margin-left: auto;
        color: #fff;
        background: #2574d6;
        border-color: #2574d6;
      }
      #update[hidden] {
        display: none;
      }
      #tools {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px;
        border-right: 1px solid #d8d6cf;
      }
      button {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: none;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #c8c5bc;
        background: #fbfaf7;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.chosen {
        border-color: #2574d6;
        background: #e3edf9;
      }
      #toolbar button {
        white-space: nowrap;
      }
      /* Its longest example would make it wider than the rest of the toolbar */
      #examples {
        max-width: 170px;
      }
      button img {
        width: 20px;
        height: 20px;
      }
      #tools button span {
        display: none;
      }
      #canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      /* The rulers along the top and left, the corner between them, and the canvas */
      #canvas-host {
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto 1fr;
        min-width: 0;
        min-height: 0;
      }
      #canvas-area {
        grid-column: 2;
        grid-row: 2;
        position: relative;
        min-width: 0;
        min-height: 0;
      }
      .ruler,
      .ruler-corner {
        background: #f0efec;
      }
      /* Sized by the grid alone: without contain, the canvas's own size (its
         pixels, the CSS size times devicePixelRatio) fed back into the grid
         at a fractional ratio, such as 1.25, and the left ruler grew each frame */
      .ruler {
        display: block;
        contain: size;
        min-width: 0;
        min-height: 0;
      }
      .ruler-top {
        grid-column: 2;
        grid-row: 1;
        width: 100%;
        height: 22px;
        border-bottom: 1px solid #6e6c68;
        box-sizing: border-box;
      }
      .ruler-left {
        grid-column: 1;
        grid-row: 2;
        width: 22px;
        height: 100%;
        border-right: 1px solid #6e6c68;
        box-sizing: border-box;
      }
      .ruler-corner {
        grid-column: 1;
        grid-row: 1;
        width: 22px;
        height: 22px;
        box-sizing: border-box;
        border-right: 1px solid #6e6c68;
        border-bottom: 1px solid #6e6c68;
        overflow: hidden;
        font-size: 10px;
        font-weight: bold;
        line-height: 21px;
        text-align: center;
        color: #1468c8;
      }
      #canvas-host.no-rulers .ruler,
      #canvas-host.no-rulers .ruler-corner {
        display: none;
      }
      .note-editor {
        position: absolute;
        min-width: 12em;
        padding: 2px 4px;
        border: 1px solid #2574d6;
        border-radius: 2px;
        font-family: system-ui, sans-serif;
        line-height: 1.25;
        background: #fff;
        resize: both;
      }
      #status {
        grid-column: 1 / 4;
        padding: 4px 8px;
        border-top: 1px solid #d8d6cf;
        min-height: 1.4em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #status button {
        margin-left: 4px;
        padding: 0 8px;
        font: inherit;
      }
      select {
        margin: 0 8px;
        font: inherit;
      }
      /* The side panel: a column of tab icons, and the open tab beside it */
      .side-tabs {
        display: flex;
        min-height: 0;
        border-left: 1px solid #d8d6cf;
      }
      .side-rail,
      .side-column {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .side-rail {
        padding: 4px;
        border-right: 1px solid #d8d6cf;
      }
      .side-column {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      /* Tabs kept at the foot of the column, such as Problems */
      .side-foot {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: auto;
      }
      .side-column button {
        position: relative;
      }
      /* A count on a tab's icon, at its top right */
      .side-badge {
        position: absolute;
        top: 1px;
        right: 1px;
        min-width: 14px;
        height: 14px;
        padding: 0 3px;
        box-sizing: border-box;
        font-size: 9px;
        font-weight: 700;
        line-height: 14px;
        text-align: center;
        color: #fff;
        background: #2574d6;
        border-radius: 7px;
      }
      .side-badge[hidden] {
        display: none;
      }
      .side-page {
        display: flex;
        flex-direction: column;
        width: min(440px, 55vw);
        min-height: 0;
      }
      .side-page[hidden] {
        display: none;
      }
      .side-title {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        font-weight: 600;
        border-bottom: 1px solid #d8d6cf;
      }
      .side-title img {
        width: 18px;
        height: 18px;
      }
      .side-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .list-panel {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .list-panel[hidden] {
        display: none;
      }
      /* The Properties tab: a caption and a value to a row */
      .properties {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 6px;
      }
      .properties[hidden] {
        display: none;
      }
      .property-grid {
        display: grid;
        grid-template-columns: minmax(80px, 35%) minmax(0, 1fr);
        gap: 4px 8px;
        align-items: start;
      }
      .property-title {
        grid-column: 1 / -1;
        color: #80868f;
      }
      .property-caption {
        overflow: hidden;
        padding: 3px 0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .property-value {
        min-width: 0;
      }
      .property-value input[type='text'],
      .property-value input[type='number'],
      .property-value textarea,
      .property-value select {
        box-sizing: border-box;
        width: 100%;
        font: inherit;
      }
      .property-value input[type='text'],
      .property-value input[type='number'],
      .property-value textarea {
        padding: 2px 5px;
      }
      .property-value textarea {
        resize: vertical;
      }
      .property-value select {
        margin: 0;
      }
      .property-color {
        display: flex;
        gap: 4px;
      }
      .property-color select {
        flex: 1;
      }
      .property-swatch {
        box-sizing: border-box;
        flex: none;
        width: 36px;
        height: 24px;
        margin: 0;
        padding: 1px;
      }
      .property-check {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        padding: 2px 0;
      }
      .property-value input.refused,
      .property-value textarea.refused {
        color: #d13438;
        background: #ffd8d8;
      }
      .property-value input[readonly],
      .property-value textarea[readonly] {
        color: #5d636b;
        background: #f1f0ec;
      }
      .property-text {
        display: block;
        overflow: hidden;
        padding: 3px 0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .property-refusal,
      .property-problem {
        color: #d13438;
      }
      .property-refusal[hidden],
      .property-problem[hidden] {
        display: none;
      }
      .property-problem {
        grid-column: 1 / -1;
      }
      /* Print…: the paper, then open or download the PDF */
      .print-dialog {
        width: min(440px, 90vw);
        padding: 12px;
        border: 1px solid #c8c5bc;
        background: #f2f1ed;
      }
      .print-dialog::backdrop {
        background: rgb(0 0 0 / 20%);
      }
      .print-dialog h2 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .print-about {
        margin: 0 0 10px;
        color: #5d636b;
      }
      .print-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .print-row select {
        margin: 0;
        font: inherit;
      }
      .print-notes {
        min-height: 2.6em;
        margin-top: 8px;
        white-space: pre-wrap;
        color: #5d636b;
      }
      .print-notes.refused {
        color: #d13438;
      }
      .print-buttons {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .print-buttons button {
        padding: 3px 12px;
        font: inherit;
        border: 1px solid #c8c5bc;
        border-radius: 3px;
        background: #fbfaf7;
      }
      .print-buttons button.default {
        color: #fff;
        background: #2574d6;
        border-color: #2574d6;
      }
      .print-buttons button:disabled {
        opacity: 0.6;
      }
      /* The Garment tab: its choices, the drawing and what was left out */
      .garment {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-height: 0;
        padding: 6px;
      }
      .garment[hidden] {
        display: none;
      }
      .garment-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .garment-toolbar select {
        flex: 1;
        min-width: 0;
        font: inherit;
      }
      .garment-toolbar label {
        white-space: nowrap;
      }
      .garment-toolbar button,
      .garment-export button {
        padding: 3px 12px;
        font: inherit;
        border: 1px solid #c8c5bc;
        border-radius: 3px;
        background: #fbfaf7;
      }
      .garment-drawing {
        flex: 1;
        min-height: 120px;
        overflow: hidden;
        background: #fff;
        border: 1px solid #c8c5bc;
        touch-action: none;
      }
      .garment-notes {
        max-height: 6em;
        overflow: auto;
        white-space: pre-wrap;
        color: #5d636b;
      }
      .garment-export {
        width: min(360px, 90vw);
        padding: 12px;
        border: 1px solid #c8c5bc;
        background: #f2f1ed;
      }
      .garment-export::backdrop {
        background: rgb(0 0 0 / 20%);
      }
      .garment-export h2 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .garment-export label {
        display: block;
        margin: 4px 0;
      }
      .garment-export-width input {
        width: 6em;
        font: inherit;
      }
      .garment-export-reason {
        min-height: 1.3em;
        color: #d13438;
      }
      .garment-export-buttons {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .garment-export button.default {
        color: #fff;
        background: #2574d6;
        border-color: #2574d6;
      }
      /* The Problems tab: each problem in full, one to a row */
      .problems {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 6px;
      }
      .problems[hidden] {
        display: none;
      }
      .problems-none {
        color: #5d636b;
      }
      .problems-none[hidden],
      .problems-list[hidden] {
        display: none;
      }
      .problems-list {
        flex: 1;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: auto;
        list-style: none;
        background: #fff;
        border: 1px solid #c8c5bc;
      }
      .problems-list li {
        padding: 3px 6px;
        white-space: pre-wrap;
        border-bottom: 1px solid #eeece6;
        cursor: default;
      }
      .problems-list li:hover {
        background: #f2f1ed;
      }
      .problems-list li.chosen {
        color: #fff;
        background: #2574d6;
      }
      /* The Materials tab, and the dialog that edits them */
      .materials {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-height: 0;
        padding: 6px;
      }
      .materials[hidden] {
        display: none;
      }
      .material-grid {
        flex: 1;
        min-height: 80px;
        overflow: auto;
        background: #fff;
        border: 1px solid #c8c5bc;
      }
      .material-grid table {
        width: 100%;
        border-collapse: collapse;
      }
      .material-grid th,
      .material-grid td {
        padding: 2px 6px;
        text-align: left;
        white-space: nowrap;
      }
      .material-grid th {
        position: sticky;
        top: 0;
        font-weight: 500;
        background: #f2f1ed;
      }
      .material-grid tr.selected td {
        color: #fff;
        background: #2574d6;
      }
      .material-swatch {
        display: inline-block;
        width: 36px;
        height: 14px;
        vertical-align: middle;
        border: 1px solid #80868f;
      }
      .material-swatch.large {
        flex: 1;
        height: 24px;
      }
      .material-cut-list pre {
        margin: 0;
        max-height: 7em;
        overflow: auto;
        font: inherit;
        white-space: pre-wrap;
      }
      .materials-dialog {
        width: min(680px, 90vw);
        padding: 12px;
        border: 1px solid #c8c5bc;
        background: #f2f1ed;
      }
      .materials-dialog::backdrop {
        background: rgb(0 0 0 / 20%);
      }
      .materials-dialog h2 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .materials-body {
        display: flex;
        gap: 12px;
        min-height: 360px;
      }
      .materials-left {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .materials-fields {
        display: flex;
        flex-direction: column;
        gap: 3px;
        width: 240px;
      }
      .materials-fields input[type='text'],
      .materials-fields select {
        box-sizing: border-box;
        width: 100%;
        margin: 0;
        padding: 2px 5px;
        font: inherit;
      }
      .materials-fields input.refused {
        color: #d13438;
        background: #ffd8d8;
      }
      .materials-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .materials-row input[type='text'] {
        flex: 1;
      }
      .materials-check {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        margin-top: 4px;
      }
      .materials-reason {
        min-height: 2.6em;
        color: #d13438;
      }
      .materials-bottom {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .materials-dialog button,
      .materials button {
        padding: 3px 12px;
        font: inherit;
        border: 1px solid #c8c5bc;
        border-radius: 3px;
        background: #fbfaf7;
      }
      /* The Features tab: the features, then the chosen one's form */
      .features {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 6px;
      }
      .features[hidden] {
        display: none;
      }
      .features select {
        margin: 0;
      }
      .feature-kinds {
        font: inherit;
      }
      .feature-header {
        font-weight: 600;
      }
      .feature-fields {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .feature-field {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .feature-field input[type='text'],
      .feature-field select {
        box-sizing: border-box;
        width: 100%;
        padding: 2px 5px;
        font: inherit;
      }
      .feature-field label.disabled {
        color: #a0a4aa;
      }
      .feature-check {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .feature-apply {
        align-self: flex-start;
        padding: 3px 14px;
        font: inherit;
        border: 1px solid #c8c5bc;
        border-radius: 3px;
        background: #fbfaf7;
      }
      .feature-apply:disabled {
        color: #a0a4aa;
      }
      .feature-note {
        margin: 0;
        color: #5d636b;
      }
      .property-formula {
        display: flex;
        gap: 2px;
        align-items: stretch;
      }
      .property-formula input {
        flex: 1;
        min-width: 0;
      }
      .property-wand {
        flex: none;
        width: 24px;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
      }
      .property-wand[hidden] {
        display: none;
      }
      .property-wand img {
        width: 16px;
        height: 16px;
        vertical-align: middle;
      }
      .property-wand:hover {
        background: #e8e6df;
      }
      /* A formula row's suggestions, under it across both columns */
      .suggest-list {
        grid-column: 1 / -1;
        max-height: 16em;
        margin: 0;
        padding: 2px 0;
        overflow-y: auto;
        list-style: none;
        background: #fff;
        border: 1px solid #c8c5bc;
      }
      .suggest-list li {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto 4.5em;
        gap: 0 8px;
        padding: 2px 6px;
        cursor: pointer;
      }
      .suggest-list li.suggest-none {
        display: block;
        color: #80868f;
        cursor: default;
      }
      .suggest-formula {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .suggest-value,
      .suggest-delta {
        text-align: right;
        white-space: nowrap;
      }
      .suggest-delta,
      .suggest-range {
        color: #80868f;
      }
      .suggest-range {
        grid-column: 1 / -1;
        padding-left: 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .suggest-list li.chosen,
      .suggest-list li:not(.suggest-none):hover {
        background: #e3edf9;
      }
      .list-header {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px;
      }
      .list-header input,
      .list-header select {
        margin: 0;
        font: inherit;
      }
      .list-scroller {
        flex: 1;
        min-height: 0;
        overflow: auto;
        background: #fff;
        border-top: 1px solid #d8d6cf;
      }
      .list-grid {
        table-layout: fixed;
        border-collapse: collapse;
        user-select: none;
      }
      .list-grid th {
        position: sticky;
        top: 0;
        padding: 3px 6px;
        text-align: left;
        font-weight: 600;
        background: #f2f1ed;
        border-bottom: 1px solid #d8d6cf;
      }
      .list-grid td {
        padding: 2px 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px solid #f0efea;
      }
      .list-grid tr.marked td {
        font-weight: 600;
      }
      .list-grid tr.failed td {
        color: #d13438;
      }
      .list-grid tr.blocked td {
        color: #e28c28;
      }
      .list-grid tr.selected td {
        color: #fff;
        background: #2574d6;
      }
      /* An editable list's current cell, one refused and one open */
      .list-grid tr.selected td.current {
        outline: 2px solid #0f4f9e;
        outline-offset: -2px;
      }
      .list-grid td.refused {
        color: #d13438;
        background: #ffd8d8;
      }
      .list-grid tr.selected td.refused {
        color: #d13438;
        background: #ffd8d8;
      }
      .list-grid td.editing {
        padding: 0;
        background: #fff;
      }
      .cell-editor {
        box-sizing: border-box;
        width: 100%;
        padding: 1px 5px;
        border: 1px solid #2574d6;
        font: inherit;
      }
      .list-scroller:focus {
        outline: none;
      }
      .list-buttons {
        display: flex;
        gap: 6px;
        padding: 6px;
        border-top: 1px solid #d8d6cf;
      }
      /* The Measurements tab's set, sizes and test size */
      .measurement-set,
      .measurement-test {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 0;
        padding: 4px 6px 6px;
        border: 1px solid #d8d6cf;
      }
      .measurement-test {
        margin: 6px 6px 0;
      }
      .measurement-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .measurement-row > span,
      .measurement-row > select {
        flex: 1;
      }
      .list-buttons button {
        border-color: #c8c5bc;
        background: #fbfaf7;
      }
      /* The suggestions under a formula field */
      .completer {
        position: fixed;
        z-index: 10;
        margin: 0;
        padding: 2px 0;
        overflow-y: auto;
        list-style: none;
        background: #fff;
        border: 1px solid #c8c5bc;
        box-shadow: 0 2px 6px rgb(0 0 0 / 15%);
      }
      .completer[hidden] {
        display: none;
      }
      .completer li {
        padding: 2px 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      .completer li span {
        margin-left: 1.5em;
        color: #80868f;
      }
      .completer li.chosen {
        color: #fff;
        background: #2574d6;
      }
      .completer li.chosen span {
        color: #e3edf9;
      }
      input[type='file'] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="toolbar"></div>
    <div id="tools"></div>
    <div id="canvas-host">
      <div id="canvas-area"><canvas id="canvas"></canvas></div>
    </div>
    <div id="side"></div>
    <div id="status"></div>
    <input id="open-input" type="file" accept=".sloper,.slm" multiple />
    <input id="measurements-input" type="file" accept=".slm" />
    <input id="import-input" type="file" accept=".sloper" />
    <script type="module" src="main.js"></script>
  </body>
</html>
