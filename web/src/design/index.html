<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenSloper</title>
    <link rel="icon" href="opensloper-design.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        grid-template-columns: auto 1fr auto;
        grid-template-rows: auto 1fr auto;
        font:
          13px system-ui,
          sans-serif;
        color: #222428;
        background: #f2f1ed;
      }
      #toolbar {
        grid-column: 1 / 4;
        display: flex;
        gap: 2px;
        padding: 4px;
        border-bottom: 1px solid #d8d6cf;
      }
      #tools {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px;
        border-right: 1px solid #d8d6cf;
      }
      button {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: none;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #c8c5bc;
        background: #fbfaf7;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.chosen {
        border-color: #2574d6;
        background: #e3edf9;
      }
      button img {
        width: 20px;
        height: 20px;
      }
      #tools button span {
        display: none;
      }
      #canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #canvas-host {
        position: relative;
        min-width: 0;
        min-height: 0;
      }
      .note-editor {
        position: absolute;
        min-width: 12em;
        padding: 2px 4px;
        border: 1px solid #2574d6;
        border-radius: 2px;
        font-family: system-ui, sans-serif;
        line-height: 1.25;
        background: #fff;
        resize: both;
      }
      #status {
        grid-column: 1 / 4;
        padding: 4px 8px;
        border-top: 1px solid #d8d6cf;
        min-height: 1.4em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      select {
        margin: 0 8px;
        font: inherit;
      }
      /* The side panel: a column of tab icons, and the open tab beside it */
      .side-tabs {
        display: flex;
        min-height: 0;
        border-left: 1px solid #d8d6cf;
      }
      .side-column {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px;
        border-right: 1px solid #d8d6cf;
      }
      .side-page {
        display: flex;
        flex-direction: column;
        width: 440px;
        min-height: 0;
      }
      .side-page[hidden] {
        display: none;
      }
      .side-title {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        font-weight: 600;
        border-bottom: 1px solid #d8d6cf;
      }
      .side-title img {
        width: 18px;
        height: 18px;
      }
      .side-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .list-panel {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .list-panel[hidden] {
        display: none;
      }
      /* The Properties tab: a caption and a value to a row */
      .properties {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 6px;
      }
      .properties[hidden] {
        display: none;
      }
      .property-grid {
        display: grid;
        grid-template-columns: minmax(80px, 35%) minmax(0, 1fr);
        gap: 4px 8px;
        align-items: start;
      }
      .property-title {
        grid-column: 1 / -1;
        color: #80868f;
      }
      .property-caption {
        overflow: hidden;
        padding: 3px 0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .property-value {
        min-width: 0;
      }
      .property-value input[type='text'],
      .property-value select {
        box-sizing: border-box;
        width: 100%;
        font: inherit;
      }
      .property-value input[type='text'] {
        padding: 2px 5px;
      }
      .property-value input.refused {
        color: #d13438;
        background: #ffd8d8;
      }
      .property-value input[readonly] {
        color: #5d636b;
        background: #f1f0ec;
      }
      .property-text {
        display: block;
        overflow: hidden;
        padding: 3px 0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .property-refusal,
      .property-problem {
        color: #d13438;
      }
      .property-refusal[hidden],
      .property-problem[hidden] {
        display: none;
      }
      .property-problem {
        grid-column: 1 / -1;
      }
      .list-header {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px;
      }
      .list-header input,
      .list-header select {
        margin: 0;
        font: inherit;
      }
      .list-scroller {
        flex: 1;
        min-height: 0;
        overflow: auto;
        background: #fff;
        border-top: 1px solid #d8d6cf;
      }
      .list-grid {
        table-layout: fixed;
        border-collapse: collapse;
        user-select: none;
      }
      .list-grid th {
        position: sticky;
        top: 0;
        padding: 3px 6px;
        text-align: left;
        font-weight: 600;
        background: #f2f1ed;
        border-bottom: 1px solid #d8d6cf;
      }
      .list-grid td {
        padding: 2px 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px solid #f0efea;
      }
      .list-grid tr.marked td {
        font-weight: 600;
      }
      .list-grid tr.failed td {
        color: #d13438;
      }
      .list-grid tr.blocked td {
        color: #e28c28;
      }
      .list-grid tr.selected td {
        color: #fff;
        background: #2574d6;
      }
      /* An editable list's current cell, one refused and one open */
      .list-grid tr.selected td.current {
        outline: 2px solid #0f4f9e;
        outline-offset: -2px;
      }
      .list-grid td.refused {
        color: #d13438;
        background: #ffd8d8;
      }
      .list-grid tr.selected td.refused {
        color: #d13438;
        background: #ffd8d8;
      }
      .list-grid td.editing {
        padding: 0;
        background: #fff;
      }
      .cell-editor {
        box-sizing: border-box;
        width: 100%;
        padding: 1px 5px;
        border: 1px solid #2574d6;
        font: inherit;
      }
      .list-scroller:focus {
        outline: none;
      }
      .list-buttons {
        display: flex;
        gap: 6px;
        padding: 6px;
        border-top: 1px solid #d8d6cf;
      }
      /* The Measurements tab's set, sizes and test size */
      .measurement-set,
      .measurement-test {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 0;
        padding: 4px 6px 6px;
        border: 1px solid #d8d6cf;
      }
      .measurement-test {
        margin: 6px 6px 0;
      }
      .measurement-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .measurement-row > span,
      .measurement-row > select {
        flex: 1;
      }
      .list-buttons button {
        border-color: #c8c5bc;
        background: #fbfaf7;
      }
      /* The suggestions under a formula field */
      .completer {
        position: fixed;
        z-index: 10;
        margin: 0;
        padding: 2px 0;
        overflow-y: auto;
        list-style: none;
        background: #fff;
        border: 1px solid #c8c5bc;
        box-shadow: 0 2px 6px rgb(0 0 0 / 15%);
      }
      .completer[hidden] {
        display: none;
      }
      .completer li {
        padding: 2px 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      .completer li span {
        margin-left: 1.5em;
        color: #80868f;
      }
      .completer li.chosen {
        color: #fff;
        background: #2574d6;
      }
      .completer li.chosen span {
        color: #e3edf9;
      }
      input[type='file'] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="toolbar"></div>
    <div id="tools"></div>
    <div id="canvas-host"><canvas id="canvas"></canvas></div>
    <div id="side"></div>
    <div id="status"></div>
    <input id="open-input" type="file" accept=".sloper,.slm" multiple />
    <input id="measurements-input" type="file" accept=".slm" />
    <script type="module" src="main.js"></script>
  </body>
</html>
