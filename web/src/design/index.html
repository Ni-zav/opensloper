<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenSloper</title>
    <link rel="icon" href="opensloper-design.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto 1fr auto;
        font:
          13px system-ui,
          sans-serif;
        color: #222428;
        background: #f2f1ed;
      }
      #toolbar {
        grid-column: 1 / 3;
        display: flex;
        gap: 2px;
        padding: 4px;
        border-bottom: 1px solid #d8d6cf;
      }
      #tools {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px;
        border-right: 1px solid #d8d6cf;
      }
      button {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px 8px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: none;
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: #c8c5bc;
        background: #fbfaf7;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      button.chosen {
        border-color: #2574d6;
        background: #e3edf9;
      }
      button img {
        width: 20px;
        height: 20px;
      }
      #tools button span {
        display: none;
      }
      #canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      #canvas-host {
        min-width: 0;
        min-height: 0;
      }
      #status {
        grid-column: 1 / 3;
        padding: 4px 8px;
        border-top: 1px solid #d8d6cf;
        min-height: 1.4em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      select {
        margin: 0 8px;
        font: inherit;
      }
      input[type='file'] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="toolbar"></div>
    <div id="tools"></div>
    <div id="canvas-host"><canvas id="canvas"></canvas></div>
    <div id="status"></div>
    <input id="open-input" type="file" accept=".sloper,.slm" multiple />
    <input id="measurements-input" type="file" accept=".slm" />
    <script type="module" src="main.js"></script>
  </body>
</html>
