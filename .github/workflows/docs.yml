# Builds the user documentation with Zensical and publishes it to GitHub
# Pages, as two sites in one:
#
# - the root, docs.opensloper.com, from the release branch: the docs of the
#   released version, named with it;
# - /dev/, from the development branch: the docs of what is not released yet,
#   named with the commit, and kept out of search engines by robots.txt.
# - /dev/pasdoc/, generated Pascal source documentation from development.
#
# A Pages deployment replaces the whole site, so every run builds both. It runs
# on pushes to development that touch the docs, and from release.yml once a
# release is published (workflow_call), so the root changes only with a release.
#
# The reference pages in docs/reference/ are generated from the program and
# committed (see opensloper-make.sh docs), so no Pascal build is needed here.
# The example and regression files are checked against the file schemas first.
name: Documentation
on:
  push:
    branches:
      - development
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'requirements.txt'
      - 'check-schemas.py'
      - 'tests/patterns/**'
      - 'src/**/*.pas'
      - 'documents/pasdoc-introduction.txt'
      - 'opensloper-make.sh'
      - '.github/workflows/docs.yml'
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          ref: release
          path: released
          fetch-depth: 1
      - uses: actions/checkout@v7
        with:
          ref: development
          path: development
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build the released docs
        working-directory: released
        run: ./opensloper-make.sh docs
      - name: Build the development docs
        working-directory: development
        run: ./opensloper-make.sh docs --dev
      - name: Build the Pascal source docs
        working-directory: development
        run: |
          archive="$RUNNER_TEMP/pasdoc-1.0.4-linux-x86_64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 -o "$archive" \
            https://github.com/pasdoc/pasdoc/releases/download/v1.0.4/pasdoc-1.0.4-linux-x86_64.tar.gz
          echo "ef0bee4a0c5169fd92bccd594e6df9ff4f4c138b951c9a81d498cecb9602e0e9  $archive" | sha256sum -c -
          mkdir "$RUNNER_TEMP/pasdoc"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pasdoc"
          PASDOC="$RUNNER_TEMP/pasdoc/pasdoc/bin/pasdoc" ./opensloper-make.sh devdocs
          test -s release/dev_docs/index.html
      - name: Assemble the Pages site
        run: |
          mkdir site
          cp -R released/release/site_docs/. site/
          cp -R development/release/site_dev site/dev
          cp -R development/release/dev_docs site/dev/pasdoc
          printf 'User-agent: *\nDisallow: /dev/\n' > site/robots.txt
      # Named for the attempt: a re-run keeps the earlier attempt's artifact,
      # and deploy-pages fails when two have its name
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
  # A job of its own, as GitHub's Pages workflow has it: deploying in the
  # uploading job sometimes found no artifact yet
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
