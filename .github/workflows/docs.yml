# Builds the user documentation with Zensical and publishes it to GitHub
# Pages. The reference pages in docs/reference/ are generated from the
# program and committed (see opensloper-make.sh docs), so no Pascal build is needed here.
# The example and regression files are checked against the file schemas first.
name: Documentation
on:
  push:
    branches:
      - development
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'requirements.txt'
      - 'check-schemas.py'
      - 'tests/patterns/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      - run: python3 check-schemas.py docs tests
      - run: zensical build --clean --strict
      # Named for the attempt: a re-run keeps the earlier attempt's artifact,
      # and deploy-pages fails when two have its name
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: release/site_docs
  # A job of its own, as GitHub's Pages workflow has it: deploying in the
  # uploading job sometimes found no artifact yet
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
